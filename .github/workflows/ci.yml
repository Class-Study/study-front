# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — EduSpace Frontend
#
# Stages
# ──────
#  ci      — lint + type-check + build  (every push / PR to main)
#  docker  — build & push image to GHCR (main push only, after ci passes)
#  prepare — prepara EC2: Docker + Compose  (prepare-machine.yaml)
#  deploy  — copia configs, sobe nginx + frontend
#
# Secrets layout
# ──────────────
#  Organization secrets  (org → Settings → Secrets → Actions):
#    EC2_HOST          — public IP / hostname of the EC2 instance
#    EC2_USER          — SSH username (e.g. "ubuntu")
#    EC2_SSH_KEY       — PEM private key contents
#    EC2_DEPLOY_PATH   — absolute path on EC2 (default: /opt/eduspace/frontend)
#
#  Repository secrets  (repo → Settings → Secrets → Actions):
#    VITE_API_URL      — API base URL vista pelo browser
#                        use /api/v1 (relativo) quando Nginx faz proxy da API
#                        use https://api.domain.com/v1 para origem separada
#    GHCR_PAT          — Personal Access Token com read:packages (opcional;
#                        usado se o GITHUB_TOKEN não tiver permissão de pull)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:   ghcr.io
  # github.repository_owner é sempre lowercase no GHCR — garante compatibilidade
  IMAGE_NAME: ${{ github.repository_owner }}/study-front

jobs:

  # ── 1. Lint, type-check, build ──────────────────────────────────────────────
  ci:
    name: CI — lint & build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/v1' }}

  # ── 2. Build & push Docker image to GHCR ────────────────────────────────────
  docker:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api/v1' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Prepara a EC2 (Docker + Compose) ─────────────────────────────────────
  prepare:
    name: Prepare — máquina EC2
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/prepare-machine.yaml
    secrets: inherit

  # ── 4. Deploy frontend to EC2 ────────────────────────────────────────────────
  deploy:
    name: Deploy — EC2
    runs-on: ubuntu-latest
    needs: [docker, prepare]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Configura chave SSH ────────────────────────────────────────────────
      # ⚠️  Secret via env: — NÃO usar echo "${{ secrets.EC2_SSH_KEY }}" inline
      - name: Configurar chave SSH
        env:
          SSH_KEY:  ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # ── 2. Copia arquivos de configuração para EC2 ────────────────────────────
      - name: Copiar arquivos de configuração para EC2
        env:
          EC2_USER:    ${{ secrets.EC2_USER }}
          EC2_HOST:    ${{ secrets.EC2_HOST }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          # Garante estrutura de diretórios na EC2
          ssh -i ~/.ssh/ec2_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              "$EC2_USER@$EC2_HOST" \
              "sudo mkdir -p '$DEPLOY_PATH/nginx/conf.d' && \
               sudo chown -R \$USER:\$USER '$DEPLOY_PATH'"

          # Copia cada arquivo individualmente via scp nativo
          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
              docker-compose.front.yml \
              "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/docker-compose.front.yml"

          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
              nginx/nginx.conf \
              "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/nginx/nginx.conf"

          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
              nginx/conf.d/locations.conf \
              "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/nginx/conf.d/locations.conf"

      # ── 3. Executa deploy via SSH nativo ──────────────────────────────────────
      - name: Deploy via SSH
        env:
          EC2_USER:      ${{ secrets.EC2_USER }}
          EC2_HOST:      ${{ secrets.EC2_HOST }}
          DEPLOY_PATH:   ${{ secrets.EC2_DEPLOY_PATH }}
          GHCR_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR:    ${{ github.actor }}
          GHCR_OWNER:    ${{ github.repository_owner }}
          FRONT_VERSION: latest
        run: |
          ssh -i ~/.ssh/ec2_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "$EC2_USER@$EC2_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' \
               GHCR_TOKEN='$GHCR_TOKEN' \
               GHCR_ACTOR='$GHCR_ACTOR' \
               GHCR_OWNER='$GHCR_OWNER' \
               FRONT_VERSION='$FRONT_VERSION' \
               bash -s" << 'SSHEOF'
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # GHCR exige nome em lowercase
            GHCR_OWNER_LOWER=$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')

            # Atualiza .env
            if [ -f .env ]; then
              sed -i "s|^FRONT_VERSION=.*|FRONT_VERSION=${FRONT_VERSION}|" .env
              if grep -q "^GHCR_OWNER=" .env; then
                sed -i "s|^GHCR_OWNER=.*|GHCR_OWNER=${GHCR_OWNER_LOWER}|" .env
              else
                echo "GHCR_OWNER=${GHCR_OWNER_LOWER}" >> .env
              fi
            else
              printf "FRONT_VERSION=%s\nGHCR_OWNER=%s\n" "$FRONT_VERSION" "$GHCR_OWNER_LOWER" > .env
            fi

            # Login no GHCR
            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

            # Pull + sobe frontend e nginx
            sudo docker compose -f docker-compose.front.yml pull frontend
            sudo docker compose -f docker-compose.front.yml up -d --remove-orphans

            # Sanity check
            sleep 10
            RUNNING=$(sudo docker compose -f docker-compose.front.yml ps --status running 2>/dev/null | grep -c "Up\|running" || true)
            if [ "$RUNNING" -lt 2 ]; then
              echo "❌ Containers não subiram corretamente:"
              sudo docker compose -f docker-compose.front.yml ps
              sudo docker compose -f docker-compose.front.yml logs --tail=30
              exit 1
            fi

            # Limpeza
            sudo docker image prune -f
            echo "✅ Deploy do frontend concluído — nginx + frontend rodando na porta 80"
SSHEOF
