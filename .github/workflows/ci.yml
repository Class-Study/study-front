# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — EduSpace Frontend
#
# Stages
# ──────
#  ci     — lint + type-check + build  (every push / PR to main)
#  docker — build & push image to GHCR (main push only, after ci passes)
#  deploy — SSH into EC2, pull new frontend image, restart frontend container
#           (main push only, after docker stage passes)
#
# Secrets layout
# ──────────────
#  Organization secrets  (org → Settings → Secrets → Actions):
#    EC2_HOST          — public IP / hostname of the EC2 instance
#    EC2_USER          — SSH username (e.g. "ubuntu")
#    EC2_SSH_KEY       — PEM private key contents
#    EC2_DEPLOY_PATH   — absolute path on EC2 (optional, default: /opt/eduspace)
#
#  Repository secrets  (repo → Settings → Secrets → Actions):
#    VITE_API_URL      — API base URL seen by the browser
#                        use /api/v1 (relative) when Nginx proxies the API
#                        use https://api.domain.com/v1 for a separate origin
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/study-front

jobs:

  # ── 1. Lint, type-check, build ──────────────────────────────────────────────
  ci:
    name: CI — lint & build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/v1' }}

  # ── 2. Build & push Docker image to GHCR ────────────────────────────────────
  docker:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api/v1' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Deploy frontend to EC2 ────────────────────────────────────────────────
  deploy:
    name: Deploy — EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    permissions: {}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          timeout:  60s
          script: |
            set -euo pipefail

            # EC2_DEPLOY_PATH é opcional — usa /opt/eduspace como padrão
            DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/eduspace}"

            echo "📂 Deploy path: $DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "❌ Directory $DEPLOY_PATH does not exist on EC2"
              echo "   Crie com: sudo mkdir -p $DEPLOY_PATH && sudo chown $USER:$USER $DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            # Atualiza apenas a linha FRONT_VERSION no .env (backend é dono do arquivo)
            if [ -f .env ]; then
              sed -i 's/^FRONT_VERSION=.*/FRONT_VERSION=latest/' .env
            else
              echo "FRONT_VERSION=latest" > .env
            fi

            # Pull da nova imagem do frontend
            docker compose pull frontend

            # Reinicia somente o container do frontend
            docker compose up -d --no-deps --wait frontend

            # Sanity check
            docker compose ps frontend | grep -q "running" \
              || (echo "❌ frontend failed to start" && exit 1)

            # Remove imagens antigas
            docker image prune -f

            echo "✅ Deploy concluído com sucesso"

