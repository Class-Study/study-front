# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — EduSpace Frontend
#
# Pipeline stages
# ───────────────
#  ci    — lint + type-check + build (every push / PR to main)
#  docker — build & push image to GHCR (main branch only, after ci passes)
#  deploy — SSH into EC2 and run `docker compose pull && docker compose up -d`
#           (main branch only, after docker stage passes)
#
# Required GitHub secrets
# ───────────────────────
#  EC2_HOST        — public IP or hostname of the EC2 instance
#  EC2_USER        — SSH username (typically "ubuntu" for Ubuntu AMIs)
#  EC2_SSH_KEY     — contents of the EC2 SSH private key (PEM format)
#  EC2_DEPLOY_PATH — absolute path on EC2 where docker-compose.yml lives
#                    (e.g. /opt/eduspace)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/study-front

jobs:
  # ── 1. Lint, type-check, build ──────────────────────────────────────────────
  ci:
    name: CI — lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
        env:
          VITE_API_URL: /api/v1

  # ── 2. Build & push Docker image ────────────────────────────────────────────
  docker:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to EC2 ────────────────────────────────────────────────────────
  deploy:
    name: Deploy — EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_DEPLOY_PATH }}

            # Pull the latest frontend image
            docker compose pull frontend

            # Restart only the frontend and nginx containers (zero-downtime for infra)
            docker compose up -d --no-deps frontend nginx

            # Remove unused images to save disk space
            docker image prune -f
