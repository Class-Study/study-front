# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — EduSpace Frontend
#
# Stages
# ──────
#  ci     — lint + type-check + build  (every push / PR to main)
#  docker — build & push image to GHCR (main push only, after ci passes)
#  deploy — SSH into EC2, pull new frontend image, restart frontend container
#           (main push only, after docker stage passes)
#
# Secrets layout
# ──────────────
#  Organization secrets  (org → Settings → Secrets → Actions):
#    EC2_HOST          — public IP / hostname of the EC2 instance
#    EC2_USER          — SSH username (e.g. "ubuntu")
#    EC2_SSH_KEY       — PEM private key contents
#    EC2_DEPLOY_PATH   — absolute path on EC2 (optional, default: /opt/eduspace)
#
#  Repository secrets  (repo → Settings → Secrets → Actions):
#    VITE_API_URL      — API base URL seen by the browser
#                        use /api/v1 (relative) when Nginx proxies the API
#                        use https://api.domain.com/v1 for a separate origin
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/study-front

jobs:

  # ── 1. Lint, type-check, build ──────────────────────────────────────────────
  ci:
    name: CI — lint & build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/v1' }}

  # ── 2. Build & push Docker image to GHCR ────────────────────────────────────
  docker:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api/v1' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Deploy frontend to EC2 ────────────────────────────────────────────────
  deploy:
    name: Deploy — EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    permissions: {}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH:  ${{ secrets.EC2_DEPLOY_PATH || '/opt/eduspace' }}
          GHCR_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER:    ${{ github.actor }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          timeout:  120s
          envs:     DEPLOY_PATH,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail

            # ── 1. Instala Docker se não estiver presente ─────────────────────
            if ! command -v docker &>/dev/null; then
              echo "🐳 Docker não encontrado — instalando..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
              echo "✅ Docker instalado"
            else
              echo "✅ Docker já instalado: $(docker --version)"
            fi

            # ── 2. Instala Docker Compose plugin se não estiver presente ──────
            if ! docker compose version &>/dev/null; then
              echo "🐳 Docker Compose plugin não encontrado — instalando..."
              COMPOSE_VERSION=$(curl -fsSL https://api.github.com/repos/docker/compose/releases/latest \
                | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -fsSL \
                "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              echo "✅ Docker Compose instalado: $(docker compose version)"
            else
              echo "✅ Docker Compose já instalado: $(docker compose version)"
            fi

            # ── 3. Garante que o grupo docker está ativo na sessão atual ──────
            # (necessário quando docker foi instalado nessa mesma execução)
            if ! groups | grep -q docker; then
              exec sg docker "$0" "$@" 2>/dev/null || true
            fi

            # ── 4. Cria o diretório de deploy se não existir ──────────────────
            echo "📂 Deploy path: $DEPLOY_PATH"
            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown "$USER":"$USER" "$DEPLOY_PATH"

            cd "$DEPLOY_PATH"

            # ── 5. Login no GHCR para poder fazer pull da imagem ─────────────
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # ── 6. Atualiza FRONT_VERSION no .env ────────────────────────────
            if [ -f .env ]; then
              sed -i 's/^FRONT_VERSION=.*/FRONT_VERSION=latest/' .env
            else
              echo "FRONT_VERSION=latest" > .env
            fi

            # ── 7. Pull da nova imagem do frontend ───────────────────────────
            docker compose pull frontend

            # ── 8. Reinicia somente o container do frontend ───────────────────
            docker compose up -d --no-deps --wait frontend

            # ── 9. Sanity check ───────────────────────────────────────────────
            docker compose ps frontend | grep -q "running" \
              || (echo "❌ frontend failed to start" && exit 1)

            # ── 10. Remove imagens antigas ────────────────────────────────────
            docker image prune -f

            echo "✅ Deploy concluído com sucesso"