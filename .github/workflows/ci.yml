# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — EduSpace Frontend
#
# Stages
# ──────
#  ci      — lint + type-check + build  (every push / PR to main)
#  docker  — build & push image to GHCR (main push only, after ci passes)
#  prepare — prepara EC2: Docker + Compose  (prepare-machine.yaml)
#  deploy  — copia configs, sobe nginx + frontend
#
# Secrets layout
# ──────────────
#  Organization secrets  (org → Settings → Secrets → Actions):
#    EC2_HOST          — public IP / hostname of the EC2 instance
#    EC2_USER          — SSH username (e.g. "ubuntu")
#    EC2_SSH_KEY       — PEM private key contents
#    EC2_DEPLOY_PATH   — absolute path on EC2 (default: /opt/eduspace/frontend)
#
#  Repository secrets  (repo → Settings → Secrets → Actions):
#    VITE_API_URL      — API base URL vista pelo browser
#                        use /api/v1 (relativo) quando Nginx faz proxy da API
#                        use https://api.domain.com/v1 para origem separada
#    GHCR_PAT          — Personal Access Token com read:packages (opcional;
#                        usado se o GITHUB_TOKEN não tiver permissão de pull)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:   ghcr.io
  # github.repository_owner é sempre lowercase no GHCR — garante compatibilidade
  IMAGE_NAME: ${{ github.repository_owner }}/study-front

jobs:

  # ── 1. Lint, type-check, build ──────────────────────────────────────────────
  ci:
    name: CI — lint & build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/v1' }}

  # ── 2. Build & push Docker image to GHCR ────────────────────────────────────
  docker:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api/v1' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Prepara a EC2 (Docker + Compose) ─────────────────────────────────────
  prepare:
    name: Prepare — máquina EC2
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/prepare-machine.yaml
    secrets: inherit

  # ── 4. Deploy frontend to EC2 ────────────────────────────────────────────────
  deploy:
    name: Deploy — EC2
    runs-on: ubuntu-latest
    needs: [docker, prepare]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Copia arquivos de configuração para a EC2 via SCP ──────────────────
      - name: Copy config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          source:   "docker-compose.front.yml,nginx/nginx.conf,nginx/conf.d/locations.conf"
          target:   /tmp/eduspace-deploy

      # ── Organiza arquivos e sobe os containers ────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH:   ${{ secrets.EC2_DEPLOY_PATH || '/opt/eduspace/frontend' }}
          GHCR_TOKEN:    ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          GHCR_USER:     ${{ github.actor }}
          GHCR_OWNER:    ${{ github.repository_owner }}
          FRONT_VERSION: latest
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          timeout:  180s
          envs:     DEPLOY_PATH,GHCR_TOKEN,GHCR_USER,GHCR_OWNER,FRONT_VERSION
          script: |
            set -euo pipefail

            # ── 1. Organiza diretório de deploy ───────────────────────────────
            # (Docker e Docker Compose já instalados pelo job prepare)
            echo "📂 Deploy path: $DEPLOY_PATH"
            sudo mkdir -p "$DEPLOY_PATH/nginx/conf.d"
            sudo chown -R "$USER":"$USER" "$DEPLOY_PATH"

            # ── 2. Copia configs do staging para o diretório de deploy ────────
            # O scp-action copia mantendo a estrutura de pastas dentro de /tmp/eduspace-deploy
            SRC=/tmp/eduspace-deploy
            cp "$SRC/docker-compose.front.yml"        "$DEPLOY_PATH/docker-compose.front.yml"
            cp "$SRC/nginx/nginx.conf"                 "$DEPLOY_PATH/nginx/nginx.conf"
            cp "$SRC/nginx/conf.d/locations.conf"      "$DEPLOY_PATH/nginx/conf.d/locations.conf"
            rm -rf "$SRC"

            cd "$DEPLOY_PATH"

            # ── 3. Grava .env ─────────────────────────────────────────────────
            # Docker exige nomes de imagem em lowercase
            GHCR_OWNER_LOWER=$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')

            if [ -f .env ]; then
              sed -i 's/^FRONT_VERSION=.*/FRONT_VERSION=latest/' .env
              grep -q "^GHCR_OWNER=" .env \
                && sed -i "s/^GHCR_OWNER=.*/GHCR_OWNER=${GHCR_OWNER_LOWER}/" .env \
                || echo "GHCR_OWNER=${GHCR_OWNER_LOWER}" >> .env
            else
              printf "FRONT_VERSION=latest\nGHCR_OWNER=%s\n" "$GHCR_OWNER_LOWER" > .env
            fi

            # ── 4. Login no GHCR ──────────────────────────────────────────────
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # ── 5. Pull + sobe nginx e frontend ───────────────────────────────
            sudo GHCR_OWNER="$GHCR_OWNER_LOWER" docker compose -f docker-compose.front.yml pull frontend
            sudo GHCR_OWNER="$GHCR_OWNER_LOWER" docker compose -f docker-compose.front.yml up -d

            # ── 6. Aguarda containers subirem ─────────────────────────────────
            echo "⏳ Aguardando containers..."
            sleep 5
            sudo GHCR_OWNER="$GHCR_OWNER_LOWER" docker compose -f docker-compose.front.yml ps

            # ── 7. Sanity check ───────────────────────────────────────────────
            RUNNING=$(sudo GHCR_OWNER="$GHCR_OWNER_LOWER" docker compose -f docker-compose.front.yml ps --status running 2>/dev/null | grep -c "Up\|running" || true)
            if [ "$RUNNING" -lt 2 ]; then
              echo "❌ Containers não subiram corretamente:"
              sudo GHCR_OWNER="$GHCR_OWNER_LOWER" docker compose -f docker-compose.front.yml ps
              sudo GHCR_OWNER="$GHCR_OWNER_LOWER" docker compose -f docker-compose.front.yml logs --tail=20
              exit 1
            fi

            # ── 8. Limpa imagens antigas ──────────────────────────────────────
            sudo docker image prune -f

            echo "✅ Deploy concluído — nginx + frontend rodando na porta 80"
