# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.front.yml — Frontend
#
# O nginx reverse-proxy já roda na infra (study-core).
# Este compose sobe apenas o container do frontend.
#
# Uso:
#   docker compose -f docker-compose.front.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  frontend:
    image: ghcr.io/${GHCR_OWNER:-class-study}/study-front:${FRONT_VERSION:-latest}
    restart: unless-stopped

volumes: {}
