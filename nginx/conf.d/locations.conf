# Shared location blocks included in both the HTTP and HTTPS server blocks.
# This avoids duplicating proxy rules when the HTTPS block is enabled.

# ── WebSocket endpoint (must come before the generic /api/ block) ─────────────
# Nginx must forward the Upgrade/Connection headers so the backend can upgrade
# the TCP connection to a WebSocket session.
# Read timeout is set to 1 hour to keep long-lived connections alive.
location /api/v1/ws {
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ── REST API ──────────────────────────────────────────────────────────────────
location /api/ {
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Pass large request bodies (e.g. file uploads)
    client_max_body_size 50m;
}

# ── Frontend SPA ──────────────────────────────────────────────────────────────
location / {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Security headers (only on HTML responses; static assets set their own)
    add_header X-Content-Type-Options  "nosniff"    always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
