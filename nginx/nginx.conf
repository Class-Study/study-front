# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse-proxy for EduSpace on EC2
#
# Architecture (all services run inside Docker Compose on the same host):
#
#   Internet ──▶ nginx (port 80/443)
#                   ├─ /api/v1/ws  ──▶ backend:8080  (WebSocket upgrade)
#                   ├─ /api/       ──▶ backend:8080  (REST API)
#                   └─ /           ──▶ frontend:80   (React SPA)
#
# WebSocket / WebRTC notes
# ──────────────────────────
#  • WebSocket signalling (WS/WSS) is proxied via the /api/v1/ws location.
#  • WebRTC media travels peer-to-peer; Nginx is NOT on the media path.
#    Signalling must go over HTTPS/WSS so the browser can access the
#    camera/microphone (browsers block getUserMedia on plain HTTP).
#    Enable the HTTPS server block below as soon as a TLS certificate is ready.
#
# SSL (enable when certificate is available)
# ──────────────────────────────────────────
#  1. Obtain a certificate (e.g. Certbot / Let's Encrypt):
#       sudo certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
#  2. Place certs in nginx/certs/ (fullchain.pem + privkey.pem).
#  3. Uncomment the HTTPS server block below and the redirect in the HTTP block.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    image/svg+xml;

    # ── Upstream targets (match Docker Compose service names) ────────────────
    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8080;
    }

    # ── HTTP server ───────────────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;

        # ── Uncomment this block (and remove the locations below) once SSL
        #    is ready — HTTP traffic will be permanently redirected to HTTPS.
        # return 301 https://$host$request_uri;

        # ── Let's Encrypt ACME challenge (keep even after enabling HTTPS) ────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/conf.d/locations.conf;
    }

    # ── HTTPS server (uncomment when TLS certificate is ready) ───────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # Modern TLS configuration
    #     ssl_protocols             TLSv1.2 TLSv1.3;
    #     ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache         shared:SSL:10m;
    #     ssl_session_timeout       1d;
    #     ssl_session_tickets       off;
    #
    #     # HSTS (enable after confirming HTTPS works correctly)
    #     # add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     include /etc/nginx/conf.d/locations.conf;
    # }
}
